<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTF 字体查看器</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,"Segoe UI",sans-serif;background:#f4f5f7;color:#222}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;padding:6px 14px;border:1px solid #3b6fe0;background:#3b6fe0;color:#fff;border-radius:6px;cursor:pointer}
button.o{background:#fff;color:#3b6fe0}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=number],select{font:inherit;padding:4px;border:1px solid #bbb;border-radius:6px}
input[type=number]{width:70px}
#info{margin:12px;padding:12px;background:#fff;border-radius:8px;display:none}
#info h3{margin:0 0 8px}
#info dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:3px 12px}
#info dt{color:#666}#info dd{margin:0;word-break:break-all}
#bar{margin:0 12px;display:none;gap:8px;align-items:center;flex-wrap:wrap}
#wrap{margin:12px;overflow:auto;background:#fff;border-radius:8px;display:none}
#grid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));grid-template-rows:repeat(250,42px);grid-auto-flow:column;min-width:900px}
.c{display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid #eee;border-right:1px solid #eee;cursor:pointer}
.c:hover{background:#eef3ff}.c.s{background:#cfe0ff}
.g{width:40px;text-align:center;font-size:26px;line-height:1;overflow:hidden;flex:none}
.t{flex:1;font:11px/1.3 monospace;color:#555;white-space:nowrap}
.c button{padding:1px 6px;font-size:11px}
#sel{position:sticky;bottom:0;z-index:5;background:#fff;border-top:1px solid #ddd;padding:8px 12px;display:none;gap:10px;align-items:center;flex-wrap:wrap}
#sg{font-size:40px;line-height:1;min-width:56px;text-align:center}
#msg{margin:12px;color:#c33}
</style>
</head>
<body>
<header>
  <button id="add">添加</button>
  <input type="file" id="file" accept=".ttf,.otf,font/ttf,application/x-font-ttf,application/octet-stream" hidden>
  <span id="fn" style="color:#666">请选择 ttf 文件</span>
</header>
<div id="msg"></div>
<div id="info"></div>
<div id="bar">
  <button class="o" id="prev">上一页</button>
  <span id="pg"></span>
  <button class="o" id="next">下一页</button>
  <input type="number" id="jmp" min="1" placeholder="页码"><button class="o" id="go">跳转</button>
  <button id="savePage">保存本页为PNG</button>
</div>
<div id="wrap"><div id="grid"></div></div>
<div id="sel">
  <span id="sg"></span>
  <span id="si" style="font-family:monospace"></span>
  <select id="size"><option value="128">128px</option><option value="256" selected>256px</option><option value="512">512px</option><option value="1024">1024px</option></select>
  <label><input type="checkbox" id="tp"> 透明背景</label>
  <button id="saveOne">保存选中为PNG</button>
</div>
<div id="toast"></div>
<div id="ov"><div><span id="ovn"></span> <button id="ovd">下载</button> <button id="ovs">分享 / 另存为</button> <button class="o" id="ovc">关闭</button></div><p>长按下方图片，选择「保存图片」即可保存到本地</p><img alt=""></div>
<style>
#toast{display:none;position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:20;background:#222;color:#fff;padding:8px 14px;border-radius:8px;max-width:90%;text-align:center}
#toast a{color:#8ab4ff}
#ov{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.85);color:#fff;flex-direction:column;align-items:center;gap:8px;padding:16px;overflow:auto}
#ov img{max-width:100%;background:#fff;image-rendering:auto}
#ov p{margin:0;color:#ccc}
</style>
<script>
const $=s=>document.querySelector(s);
const PS=1000,ROWS=250,COLS=4;
let codes=[],page=0,sel=-1,fam='',fname='font';
const hex=(n,l=4)=>n.toString(16).toUpperCase().padStart(l,'0');
const uPlus=c=>'U+'+hex(c,c>0xFFFF?5:4);
const andro=c=>{if(c<0x10000)return'\\u'+hex(c);const v=c-0x10000;return'\\u'+hex(0xD800+(v>>10))+'\\u'+hex(0xDC00+(v&0x3FF))};

$('#add').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $('#msg').textContent='';
  try{
    const buf=await f.arrayBuffer();
    const info=parseFont(buf);
    fam='UF'+Date.now();
    const face=new FontFace(fam,buf);await face.load();document.fonts.add(face);
    fname=f.name.replace(/\.[^.]+$/,'');
    $('#fn').textContent=f.name;
    codes=info.codes;page=0;sel=-1;
    showInfo(f,info);
    $('#bar').style.display='flex';$('#wrap').style.display='block';
    render();
  }catch(err){$('#msg').textContent='解析失败：'+err.message}
  e.target.value='';
};

function parseFont(buf){
  const dv=new DataView(buf);
  const tag=o=>String.fromCharCode(dv.getUint8(o),dv.getUint8(o+1),dv.getUint8(o+2),dv.getUint8(o+3));
  let off=0;const sig=tag(0);
  if(sig==='ttcf')off=dv.getUint32(12);
  const n=dv.getUint16(off+4),T={};
  for(let i=0;i<n;i++){const p=off+12+i*16;T[tag(p)]={o:dv.getUint32(p+8),l:dv.getUint32(p+12)}}
  if(!T.cmap)throw new Error('缺少 cmap 表，不是有效字体');
  const info={sig:sig==='OTTO'?'OpenType (CFF)':sig==='ttcf'?'TrueType Collection':'TrueType',tables:Object.keys(T),names:{}};
  if(T.head)info.upm=dv.getUint16(T.head.o+18);
  if(T.maxp)info.glyphs=dv.getUint16(T.maxp.o+4);
  if(T.name){
    const o=T.name.o,cnt=dv.getUint16(o+2),so=o+dv.getUint16(o+4),best={};
    for(let i=0;i<cnt;i++){
      const p=o+6+i*12,pl=dv.getUint16(p),lang=dv.getUint16(p+4),id=dv.getUint16(p+6),l=dv.getUint16(p+8),of=so+dv.getUint16(p+10);
      let sc=pl===3?(lang===0x409?3:2):pl===0?2:1;
      if(best[id]&&best[id].sc>=sc)continue;
      let s='';
      if(pl===1)for(let k=0;k<l;k++)s+=String.fromCharCode(dv.getUint8(of+k));
      else for(let k=0;k<l;k+=2)s+=String.fromCharCode(dv.getUint16(of+k));
      best[id]={sc,s};
    }
    for(const k in best)info.names[k]=best[k].s;
  }
  // cmap
  const co=T.cmap.o,nt=dv.getUint16(co+2),set=new Set();
  const add=c=>{if(c>=0x20&&!(c>=0x7F&&c<=0x9F)&&!(c>=0xD800&&c<=0xDFFF)&&c<=0x10FFFF)set.add(c)};
  const u16=o=>dv.getUint16(o);
  for(let i=0;i<nt;i++){
    const p=co+4+i*8,pl=u16(p);if(pl!==0&&pl!==3)continue;
    const s=co+dv.getUint32(p+4),fmt=u16(s);
    if(fmt===4){
      const sx=u16(s+6),n2=sx/2,eO=s+14,stO=eO+sx+2,dO=stO+sx,rO=dO+sx;
      for(let k=0;k<n2;k++){
        const e=u16(eO+2*k),st=u16(stO+2*k),d=u16(dO+2*k),ro=u16(rO+2*k);
        for(let c=st;c<=e&&c<0xFFFF;c++){
          let g;
          if(ro===0)g=(c+d)&0xFFFF;
          else{const a=rO+2*k+ro+2*(c-st);if(a+2>dv.byteLength)continue;g=u16(a);if(g)g=(g+d)&0xFFFF}
          if(g)add(c);
        }
      }
    }else if(fmt===12){
      const ng=dv.getUint32(s+12);
      for(let k=0;k<ng;k++){
        const q=s+16+k*12,st=dv.getUint32(q),e=dv.getUint32(q+4),g=dv.getUint32(q+8);
        for(let c=st;c<=e&&c<=0x10FFFF;c++)if(g+(c-st)!==0)add(c);
      }
    }else if(fmt===6){
      const f=u16(s+6),c=u16(s+8);
      for(let k=0;k<c;k++)if(u16(s+10+2*k))add(f+k);
    }else if(fmt===0){
      for(let k=0;k<256;k++)if(dv.getUint8(s+6+k))add(k);
    }
  }
  info.codes=[...set].sort((a,b)=>a-b);
  if(!info.codes.length)throw new Error('未找到可显示的 Unicode 字符');
  return info;
}

function showInfo(f,i){
  const N=i.names,esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const rows=[['字体家族',N[1]],['样式',N[2]],['完整名称',N[4]],['PostScript 名',N[6]],['版本',N[5]],['版权',N[0]],['厂商',N[8]],['设计师',N[9]],['许可',N[13]],
    ['格式',i.sig],['文件大小',(f.size/1024).toFixed(1)+' KB'],['字形数',i.glyphs],['unitsPerEm',i.upm],
    ['字符数（Unicode）',i.codes.length],['编码范围',uPlus(i.codes[0])+' ~ '+uPlus(i.codes.at(-1))],['包含的表',i.tables.join(', ')]];
  $('#info').style.display='block';
  $('#info').innerHTML='<h3>字体信息</h3><dl>'+rows.filter(r=>r[1]!==undefined&&r[1]!=='').map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')+'</dl>';
}

function render(){
  const tp=Math.ceil(codes.length/PS);
  const st=page*PS,items=codes.slice(st,st+PS);
  $('#grid').style.fontFamily=`"${fam}"`;
  $('#grid').innerHTML=items.map((c,k)=>{const i=st+k;
    return`<div class="c${i===sel?' s':''}" data-i="${i}"><span class="g" style="font-family:'${fam}'">&#${c};</span><span class="t">${uPlus(c)}<br>${andro(c)}</span><button class="o" data-s="${i}">PNG</button></div>`}).join('');
  $('#pg').textContent=`第 ${page+1} / ${tp} 页（共 ${codes.length} 字，每页 ${COLS} 列×${ROWS} 行）`;
  $('#prev').disabled=page===0;$('#next').disabled=page>=tp-1;
  $('#jmp').max=tp;
  $('#wrap').scrollTop=0;scrollTo(0,0);
}
$('#prev').onclick=()=>{page--;render()};
$('#next').onclick=()=>{page++;render()};
$('#go').onclick=()=>{const tp=Math.ceil(codes.length/PS),v=parseInt($('#jmp').value);if(v>=1&&v<=tp){page=v-1;render()}};

function select(i){
  sel=i;
  document.querySelectorAll('.c.s').forEach(e=>e.classList.remove('s'));
  const el=document.querySelector(`.c[data-i="${i}"]`);if(el)el.classList.add('s');
  const c=codes[i];
  $('#sel').style.display='flex';
  $('#sg').style.fontFamily=`'${fam}'`;$('#sg').textContent=String.fromCodePoint(c);
  $('#si').innerHTML=uPlus(c)+'<br>'+andro(c);
}
$('#grid').onclick=e=>{
  const b=e.target.closest('button[data-s]');
  const c=e.target.closest('.c');if(!c)return;
  const i=+c.dataset.i;select(i);
  if(b)saveGlyph(i);
};
$('#saveOne').onclick=()=>{if(sel>=0)saveGlyph(sel)};

let toastT;
function toast(h){const t=$('#toast');t.innerHTML=h;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',8000)}
async function download(canvas,name){
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  if(!blob){toast('生成图片失败（图片可能过大）');return}
  if(window.Android){const u=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});toast(Android.savePng(u,name));return}
  // 1. 支持的浏览器：弹出“另存为”，选择本地保存位置
  if(window.showSaveFilePicker){
    try{
      const h=await showSaveFilePicker({suggestedName:name,types:[{description:'PNG 图片',accept:{'image/png':['.png']}}]});
      const w=await h.createWritable();await w.write(blob);await w.close();
      toast('已保存：'+h.name);return;
    }catch(e){if(e.name==='AbortError')return}
  }
  // 2. 普通下载（保存到浏览器的下载目录）
  // 2. 手机浏览器（如 Alook）：直接弹出图片，长按保存
  const url=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});
  preview(blob,url,name);
}
function preview(blob,url,name){
  $('#ovd').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()};
  $('#ov img').src=url;$('#ovn').textContent=name;$('#ov').style.display='flex';
  const sh=$('#ovs'),f=new File([blob],name,{type:'image/png'});
  sh.style.display=(navigator.canShare&&navigator.canShare({files:[f]}))?'inline-block':'none';
  sh.onclick=()=>navigator.share({files:[f],title:name}).catch(()=>{});
}
$('#ovc').onclick=()=>$('#ov').style.display='none';
function saveGlyph(i){
  const c=codes[i],ch=String.fromCodePoint(c),s=+$('#size').value;
  const cv=document.createElement('canvas');cv.width=cv.height=s;
  const x=cv.getContext('2d');
  if(!$('#tp').checked){x.fillStyle='#fff';x.fillRect(0,0,s,s)}
  let fs=s*0.7,m;
  const set=()=>{x.font=`${fs}px "${fam}"`;m=x.measureText(ch)};
  set();
  const w=m.actualBoundingBoxLeft+m.actualBoundingBoxRight,h=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
  const k=Math.max(w,h)/(s*0.9);if(k>1){fs/=k;set()}
  const w2=m.actualBoundingBoxLeft+m.actualBoundingBoxRight,h2=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
  x.fillStyle='#000';x.textAlign='left';x.textBaseline='alphabetic';
  if(w2>0){x.fillText(ch,(s-w2)/2+m.actualBoundingBoxLeft,(s-h2)/2+m.actualBoundingBoxAscent)}
  else x.fillText(ch,(s-m.width)/2,s*0.7);
  download(cv,`${fname}_${uPlus(c)}.png`);
}

$('#savePage').onclick=()=>{
  const st=page*PS,items=codes.slice(st,st+PS),rows=Math.min(ROWS,items.length),W=240,H=40;
  const cv=document.createElement('canvas');cv.width=COLS*W;cv.height=rows*H;
  const x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);
  x.strokeStyle='#ddd';x.textBaseline='middle';
  items.forEach((c,k)=>{
    const cx=Math.floor(k/ROWS)*W,cy=(k%ROWS)*H;
    x.strokeRect(cx+.5,cy+.5,W,H);
    x.fillStyle='#000';x.font=`26px "${fam}"`;x.textAlign='center';
    x.fillText(String.fromCodePoint(c),cx+30,cy+H/2+1);
    x.fillStyle='#555';x.font='12px monospace';x.textAlign='left';
    x.fillText(uPlus(c),cx+62,cy+14);x.fillText(andro(c),cx+62,cy+29);
  });
  download(cv,`${fname}_page${page+1}.png`);
};
</script>
</body>
</html>
