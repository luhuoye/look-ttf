<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 改动1：viewport-fit=cover 适配挖孔屏；maximum-scale 防双击缩放误触 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>TTF 字体查看器</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,"Segoe UI",sans-serif;background:#f4f5f7;color:#222;
  padding-bottom:env(safe-area-inset-bottom)}
/* 改动：顶部/底部栏避让刘海与手势条 */
header{position:sticky;top:0;top:env(safe-area-inset-top);z-index:5;background:#fff;border-bottom:1px solid #ddd;
  padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;padding:6px 14px;border:1px solid #3b6fe0;background:#3b6fe0;color:#fff;border-radius:6px;cursor:pointer}
button.o{background:#fff;color:#3b6fe0}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=number],select{font:inherit;padding:4px;border:1px solid #bbb;border-radius:6px}
input[type=number]{width:64px}
#info{margin:12px;padding:12px;background:#fff;border-radius:8px;display:none}
#info h3{margin:0 0 8px}
#info dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:3px 12px}
#info dt{color:#666}#info dd{margin:0;word-break:break-all}
#bar{margin:0 12px;display:none;gap:8px;align-items:center;flex-wrap:wrap}
#wrap{margin:12px;overflow:auto;background:#fff;border-radius:8px;
  /* 改动：给底部固定栏留出空间，避免最后一排被盖住 */
  padding-bottom:64px}
#grid{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(150px,1fr));grid-auto-rows:46px;grid-auto-flow:column;min-width:100%}
.c{display:flex;align-items:center;gap:6px;padding:0 6px;border-bottom:1px solid #eee;border-right:1px solid #eee;cursor:pointer;-webkit-tap-highlight-color:transparent}
.c:hover,.c:active{background:#eef3ff}.c.s{background:#cfe0ff}
.g{width:34px;text-align:center;font-size:24px;line-height:1;overflow:hidden;flex:none}
.t{flex:1;font:10px/1.3 monospace;color:#555;white-space:nowrap;overflow:hidden}
.c button{padding:3px 8px;font-size:11px;flex:none}
#sel{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid #ddd;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:none;gap:8px;align-items:center;flex-wrap:wrap}
#sg{font-size:34px;line-height:1;min-width:44px;text-align:center}
#msg{margin:12px;color:#c33}
#hint{margin:0 12px 12px;padding:10px 12px;background:#fff8e1;border-left:3px solid #f0a020;border-radius:6px;color:#664;display:none;font-size:13px}
/* ---- toast / 预览遮罩 ---- */
#toast{display:none;position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:20;background:#222;color:#fff;
  padding:9px 16px;border-radius:8px;max-width:88%;text-align:center;font-size:13px;line-height:1.45}
#ov{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.85);color:#fff;
  flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;overflow:auto}
#ov>div{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
#ov img{max-width:100%;max-height:62vh;background:#fff;image-rendering:auto;border-radius:4px}
#ov p{margin:0;color:#bbb;font-size:12px;text-align:center}
#ov .tip{color:#f0c060}
</style>
</head>
<body>
<header>
<button id="add">＋ 添加字体</button>
<input type="file" id="file" accept=".ttf,.otf,.ttc,font/ttf,font/otf,*/*" hidden>
<span id="fn" style="color:#666;font-size:12px">请选择 ttf / otf 文件</span>
</header>

<div id="msg"></div>
<div id="hint"></div>
<div id="info"></div>
<div id="bar">
<button class="o" id="prev">上一页</button>
<span id="pg" style="font-size:12px"></span>
<button class="o" id="next">下一页</button>
<input type="number" id="jmp" min="1" placeholder="页"><button class="o" id="go">跳转</button>
<button id="savePage">保存本页 PNG</button>
</div>
<div id="wrap"><div id="grid"></div></div>

<div id="sel">
<span id="sg"></span>
<span id="si" style="font-family:monospace;font-size:11px;line-height:1.3"></span>
<select id="size"><option value="128">128px</option><option value="256" selected>256px</option><option value="512">512px</option><option value="1024">1024px</option></select>
<label style="font-size:12px"><input type="checkbox" id="tp"> 透明底</label>
<button id="saveOne">保存此字 PNG</button>
</div>

<div id="toast"></div>
<div id="ov">
  <div><span id="ovn" style="font-size:13px"></span>
    <button id="ovd">下载</button>
    <button id="ovs">系统分享</button>
    <button class="o" id="ovc">关闭</button>
  </div>
  <img alt="预览">
  <p class="tip" id="ovtip">若「下载」无反应：<b>长按上方图片 → 保存图片</b>，或用「系统分享」存到文件/相册</p>
  <p>文件已写入应用目录，可在「文件管理 → 内部存储 → Android/data/…/files/」或相册中查看</p>
</div>

<script>
const $=s=>document.querySelector(s);
/* 改动2：手机上一页 200 字足够，4~6 列自适应，滚动不卡 */
const PS=200,ROWS=50;
let COLS=4;
let codes=[],page=0,sel=-1,fam='',fname='font';
const IS_ANDROID=!!(window.Android&&window.Android.savePng);
const hex=(n,l=4)=>n.toString(16).toUpperCase().padStart(l,'0');
const uPlus=c=>'U+'+hex(c,c>0xFFFF?5:4);
const andro=c=>{if(c<0x10000)return'\\u'+hex(c);const v=c-0x10000;return'\\u'+hex(0xD800+(v>>10))+'\\u'+hex(0xDC00+(v&0x3FF))};

function fitCols(){
  const w=$('#wrap').clientWidth||360;
  COLS=Math.max(2,Math.min(6,Math.floor(w/150)));
  $('#grid').style.setProperty('--cols',COLS);
}
addEventListener('resize',()=>{fitCols();render()});

$('#add').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $('#msg').textContent='';$('#hint').style.display='none';
  if(!/\.(ttf|otf|ttc)$/i.test(f.name)){$('#msg').textContent='请选择 .ttf / .otf / .ttc 字体文件';e.target.value='';return}
  try{
    const buf=await f.arrayBuffer();
    const info=parseFont(buf);
    // 每次换字体都换新 family 名，避免同名 FontFace 缓存串字
    fam='UF'+Date.now();
    const face=new FontFace(fam,buf);
    await face.load();document.fonts.add(face);
    // 真机校验：字体是否真的可用于 canvas 渲染
    await new Promise(r=>setTimeout(r,30));
    fname=f.name.replace(/\.[^.]+$/,'');
    $('#fn').textContent=f.name;
    codes=info.codes;page=0;sel=-1;
    showInfo(f,info);
    fitCols();
    $('#bar').style.display='flex';$('#wrap').style.display='block';
    render();
    if(info.truncated){
      $('#hint').style.display='block';
      $('#hint').innerHTML='⚠️ 该字体 cmap 为 <b>format 14 / 变体序列</b>或超大范围，已按可用子表解析，共 '+info.codes.length+' 字。若个别区段缺失属正常。';
    }
  }catch(err){$('#msg').textContent='解析失败：'+(err&&err.message||err)}
  e.target.value='';   // 允许重复选同一个文件
};

function parseFont(buf){
  const dv=new DataView(buf);
  const tag=o=>String.fromCharCode(dv.getUint8(o),dv.getUint8(o+1),dv.getUint8(o+2),dv.getUint8(o+3));
  let off=0;const sig=tag(0);
  if(sig==='ttcf'){ if(dv.getUint32(4)<2) off=dv.getUint32(12); else off=dv.getUint32(12); } // 取第 0 个字体
  const n=dv.getUint16(off+4),T={};
  for(let i=0;i<n;i++){const p=off+12+i*16;T[tag(p)]={o:dv.getUint32(p+8),l:dv.getUint32(p+12)}}
  if(!T.cmap)throw new Error('缺少 cmap 表，不是有效字体');
  const info={sig:sig==='OTTO'?'OpenType (CFF)':sig==='ttcf'?'TrueType Collection (取第1个)':'TrueType',tables:Object.keys(T),names:{}};
  if(T.head)info.upm=dv.getUint16(T.head.o+18);
  if(T.maxp)info.glyphs=dv.getUint16(T.maxp.o+4);
  if(T.name){
    const o=T.name.o,cnt=dv.getUint16(o+2),so=o+dv.getUint16(o+4),best={};
    for(let i=0;i<cnt;i++){
      const p=o+6+i*12,pl=dv.getUint16(p),lang=dv.getUint16(p+4),id=dv.getUint16(p+6),l=dv.getUint16(p+8),of=so+dv.getUint16(p+10);
      if(of+l>dv.byteLength)continue;
      let sc=pl===3?(lang===0x409?3:2):pl===0?2:1;
      if(best[id]&&best[id].sc>=sc)continue;
      let s='';
      try{
        if(pl===1)for(let k=0;k<l;k++)s+=String.fromCharCode(dv.getUint8(of+k));
        else for(let k=0;k<l;k+=2)s+=String.fromCharCode(dv.getUint16(of+k));
      }catch(_){continue}
      best[id]={sc,s};
    }
    for(const k in best)info.names[k]=best[k].s;
  }
  const co=T.cmap.o,nt=dv.getUint16(co+2),set=new Set();
  const add=c=>{if(c>=0x20&&!(c>=0x7F&&c<=0x9F)&&!(c>=0xD800&&c<=0xDFFF)&&c<=0x10FFFF)set.add(c)};
  const u16=o=>(o+2<=dv.byteLength)?dv.getUint16(o):0;
  for(let i=0;i<nt;i++){
    const p=co+4+i*8;if(p+8>dv.byteLength)break;
    const pl=u16(p);if(pl!==0&&pl!==3)continue;
    const s=co+dv.getUint32(p+4);if(s+4>dv.byteLength)continue;
    const fmt=u16(s);
    if(fmt===4){
      const sx=u16(s+6),n2=sx/2,eO=s+14,stO=eO+sx+2,dO=stO+sx,rO=dO+sx;
      for(let k=0;k<n2;k++){
        const e=u16(eO+2*k),st=u16(stO+2*k),d=u16(dO+2*k),ro=u16(rO+2*k);
        for(let c=st;c<=e&&c<0xFFFF;c++){
          let g;
          if(ro===0)g=(c+d)&0xFFFF;
          else{const a=rO+2*k+ro+2*(c-st);if(a+2>dv.byteLength)continue;g=u16(a);if(g)g=(g+d)&0xFFFF}
          if(g)add(c);
        }
      }
    }else if(fmt===12){
      const ng=dv.getUint32(s+12);
      for(let k=0;k<ng&&s+16+k*12+12<=dv.byteLength;k++){
        const q=s+16+k*12,st=dv.getUint32(q),e=dv.getUint32(q+4),g=dv.getUint32(q+8);
        if(e-st>0x200000)continue;                    // 防御异常范围把手机卡死
        for(let c=st;c<=e&&c<=0x10FFFF;c++)if(g+(c-st)!==0)add(c);
      }
    }else if(fmt===6){
      const f=u16(s+6),c=u16(s+8);
      for(let k=0;k<c;k++)if(u16(s+10+2*k))add(f+k);
    }else if(fmt===0){
      for(let k=0;k<256&&s+6+k<dv.byteLength;k++)if(dv.getUint8(s+6+k))add(k);
    }
  }
  info.codes=[...set].sort((a,b)=>a-b);
  if(!info.codes.length)throw new Error('未找到可显示的 Unicode 字符（可能是纯符号/竖排字体）');
  return info;
}

function showInfo(f,i){
  const N=i.names,esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const rows=[['字体家族',N[1]],['样式',N[2]],['完整名称',N[4]],['PostScript 名',N[6]],['版本',N[5]],['版权',N[0]],
    ['厂商',N[8]],['设计师',N[9]],['许可',N[13]],['格式',i.sig],['文件大小',(f.size/1024).toFixed(1)+' KB'],
    ['字形数',i.glyphs],['unitsPerEm',i.upm],['字符数（Unicode）',i.codes.length],
    ['编码范围',uPlus(i.codes[0])+' ~ '+uPlus(i.codes.at(-1))],['包含的表',i.tables.join(', ')]];
  $('#info').style.display='block';
  $('#info').innerHTML='<h3>字体信息</h3><dl>'+rows.filter(r=>r[1]!==undefined&&r[1]!=='')
    .map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')+'</dl>';
}

function render(){
  if(!codes.length)return;
  const tp=Math.ceil(codes.length/PS);
  if(page>=tp)page=tp-1;if(page<0)page=0;
  const st=page*PS,items=codes.slice(st,st+PS);
  const perCol=Math.ceil(items.length/COLS);
  $('#grid').style.fontFamily=`"${fam}"`;
  $('#grid').style.gridTemplateRows=`repeat(${perCol},46px)`;
  $('#grid').innerHTML=items.map((c,k)=>{const i=st+k;
    return`<div class="c${i===sel?' s':''}" data-i="${i}"><span class="g" style="font-family:'${fam}'">&#${c};</span>`+
      `<span class="t">${uPlus(c)}<br>${andro(c)}</span><button class="o" data-s="${i}">PNG</button></div>`}).join('');
  $('#pg').textContent=`第 ${page+1}/${tp} 页 · 共 ${codes.length} 字`;
  $('#prev').disabled=page===0;$('#next').disabled=page>=tp-1;
  $('#jmp').max=tp;
  $('#wrap').scrollTop=0;
}
$('#prev').onclick=()=>{page--;render()};
$('#next').onclick=()=>{page++;render()};
$('#go').onclick=()=>{const tp=Math.ceil(codes.length/PS),v=parseInt($('#jmp').value);if(v>=1&&v<=tp){page=v-1;render()}};

function select(i){
  sel=i;
  document.querySelectorAll('.c.s').forEach(e=>e.classList.remove('s'));
  const el=document.querySelector(`.c[data-i="${i}"]`);if(el)el.classList.add('s');
  const c=codes[i];
  $('#sel').style.display='flex';
  $('#sg').style.fontFamily=`'${fam}'`;$('#sg').textContent=String.fromCodePoint(c);
  $('#si').innerHTML=uPlus(c)+'<br>'+andro(c);
}
$('#grid').onclick=e=>{
  const b=e.target.closest('button[data-s]');
  const c=e.target.closest('.c');if(!c)return;
  const i=+c.dataset.i;select(i);
  if(b){e.stopPropagation();saveGlyph(i)}
};
$('#saveOne').onclick=()=>{if(sel>=0)saveGlyph(sel)};

let toastT;
function toast(h,ms=4000){const t=$('#toast');t.innerHTML=h;t.style.display='block';clearTimeout(toastT);
  toastT=setTimeout(()=>t.style.display='none',ms||4000)}

/* ============ 保存链路（三段降级） ============
   ① Android.savePng()  ← WebView 注入桥，直写 MediaStore/应用目录，最稳
   ② navigator.share()   ← 系统分享面板，可存到相册/文件
   ③ 预览遮罩 + 长按保存 ← 兜底，任何 WebView 都能用                     */
async function download(canvas,name){
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  if(!blob){toast('生成失败：图片过大或内存不足');return}
  // ① 原生桥
  if(IS_ANDROID){
    try{
      const dataUrl=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});
      const ret=String(Android.savePng(dataUrl,name)||'');
      if(ret.startsWith('ok:')){toast('✅ 已保存<br><b>'+ret.slice(3)+'</b>',5000);return}
      if(ret==='denied'){toast('保存被取消（无权限？）');return}
      toast('原生保存失败，改用分享/长按：<br>'+ret,5000);
    }catch(err){ /* 落到 ② */ }
  }
  // ② 桌面/支持 File System Access 的浏览器
  if(window.showSaveFilePicker){
    try{
      const h=await showSaveFilePicker({suggestedName:name,types:[{description:'PNG 图片',accept:{'image/png':['.png']}}]});
      const w=await h.createWritable();await w.write(blob);await w.close();
      toast('已保存：'+h.name);return;
    }catch(e){if(e.name==='AbortError')return}
  }
  // ③ 分享 / 长按兜底
  const url=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});
  preview(blob,url,name);
}
function preview(blob,url,name){
  $('#ovd').onclick=()=>{
    const a=document.createElement('a');a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    toast('已触发下载；若没反应请长按图片保存');
  };
  $('#ov img').src=url;$('#ovn').textContent=name;
  $('#ov').style.display='flex';
  const sh=$('#ovs'),f=new File([blob],name,{type:'image/png'});
  const can=navigator.canShare&&navigator.canShare({files:[f]});
  sh.style.display=can?'inline-block':'none';
  sh.onclick=()=>navigator.share({files:[f],title:name}).then(()=>closeOv()).catch(()=>{});
  $('#ovtip').style.display=IS_ANDROID?'none':'block';
}
function closeOv(){$('#ov').style.display='none'}
$('#ovc').onclick=closeOv;
$('#ov').onclick=e=>{if(e.target===$('#ov'))closeOv()};   // 点遮罩关闭
addEventListener('keydown',e=>{if(e.key==='Escape')closeOv()});

function saveGlyph(i){
  const c=codes[i],ch=String.fromCodePoint(c),s=Math.max(64,+$('#size').value);
  const cv=document.createElement('canvas');cv.width=cv.height=s;
  const x=cv.getContext('2d');
  if(!$('#tp').checked){x.fillStyle='#fff';x.fillRect(0,0,s,s)}
  let fs=s*0.72,m;
  const set=()=>{x.font=`${fs}px "${fam}",sans-serif`;m=x.measureText(ch)};
  set();
  let w=m.actualBoundingBoxLeft+m.actualBoundingBoxRight,h=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
  if(w>0&&h>0){const k=Math.max(w,h)/(s*0.88);if(k>1){fs/=k;set()}}
  w=m.actualBoundingBoxLeft+m.actualBoundingBoxRight;h=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
  x.fillStyle='#000';x.textAlign='left';x.textBaseline='alphabetic';
  if(w>0&&h>0)x.fillText(ch,(s-w)/2+m.actualBoundingBoxLeft,(s-h)/2+m.actualBoundingBoxAscent);
  else x.fillText(ch,(s-m.width)/2,s*0.72);   // 空格/不可见字形兜底
  download(cv,`${fname}_${uPlus(c)}.png`);
}

$('#savePage').onclick=()=>{
  const st=page*PS,items=codes.slice(st,st+PS);
  const perCol=Math.ceil(items.length/ROWS),W=250,H=42;
  const cv=document.createElement('canvas');cv.width=perCol*W;cv.height=Math.min(ROWS,items.length)*H;
  const x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);
  x.strokeStyle='#ddd';x.textBaseline='middle';
  items.forEach((c,k)=>{
    const cx=Math.floor(k/ROWS)*W,cy=(k%ROWS)*H;
    x.strokeRect(cx+.5,cy+.5,W,H);
    x.fillStyle='#000';x.font=`24px "${fam}",sans-serif`;x.textAlign='center';
    x.fillText(String.fromCodePoint(c),cx+32,cy+H/2+1);
    x.fillStyle='#555';x.font='11px monospace';x.textAlign='left';
    x.fillText(uPlus(c),cx+58,cy+14);x.fillText(andro(c),cx+58,cy+29);
  });
  download(cv,`${fname}_page${page+1}.png`);
};

/* 原生侧就绪标记：方便 Java 判断桥注入成功 */
if(IS_ANDROID&&Android.onReady)Android.onReady();
</script>
</body>
</html>
