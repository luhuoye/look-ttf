name: Build Android APK

on:
  push:
    branches: [ main, master ]  # 当代码推送到main或master分支时触发
  workflow_dispatch:          # 允许在GitHub网页端手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 配置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 配置 Android SDK
      uses: android-actions/setup-android@v3

    - name: 赋予 Gradle 执行权限
      run: chmod +x gradlew

    - name: 构建 Debug 版 APK
      run: ./gradlew assembleDebug

    - name: 上传 APK 构建产物
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
