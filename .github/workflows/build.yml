name: 构建 TTF查看器 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:          # ← 手机上的「Run workflow」按钮靠这行

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库里通常没有 gradle-wrapper.jar（AI 生成的项目几乎都漏了），
      # 所以这里装一次 Gradle 并现场生成 wrapper，避免 "No such file or directory: ./gradlew"
      - name: 安装 Gradle 8.7 并生成 wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: 准备工程文件与图标
        run: |
          cp app-build.gradle build.gradle.real && mv build.gradle.real app/build.gradle 2>/dev/null || true
          mkdir -p app
          # 扁平目录 → 标准布局（Actions 里做，你不用在手机上挪文件）
          for d in AndroidManifest.xml src assets res; do
            [ -e "$d" ] && cp -r "$d" app/ 2>/dev/null || true
          done
          cp build.gradle build.gradle.tmp
          # 生成默认图标（没有图标 Android 12+ 会装不上）
          mkdir -p res/mipmap-anydpi-v26 res/values
          cat > res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_bg">#3B6FE0</color></resources>
          EOF
          cat > res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">TTF 查看器</string></resources>
          EOF
          cat > res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_bg"/>
            <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
          cp res/mipmap-anydpi-v26/ic_launcher.xml res/mipmap-anydpi-v26/ic_launcher_round.xml
          # 前景：用矢量画一个「字」形，无需二进制 PNG
          mkdir -p res/drawable
          cat > res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FFFFFF"
              android:pathData="M40,30h28v6h-11v34h-6V36h-11zM34,72h40v6H34z"/>
          </vector>
          EOF

      - name: 构建 Debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: 重命名产物
        run: |
          apk=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$apk" "TTF查看器-debug.apk"
          ls -lh *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TTF查看器-APK
          path: TTF查看器-debug.apk
          retention-days: 90
