name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 👇 修改1：将 JDK 11 升级为 JDK 17，并移除了容易超时的 cache: gradle
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      # 👇 修改2：使用 assembleDebug 代替 build，加入 -x lint 跳过繁琐的代码检查，并加上 --no-daemon 防止内存溢出
      run: |
        ./gradlew clean assembleDebug -x lint --no-daemon --stacktrace

    # 👇 修改3：新增自动上传 APK 步骤，编译成功后，APK 会自动出现在 Actions 的 Artifacts 里
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
